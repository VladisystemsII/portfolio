  .n-cred   { fill: #1f1608; stroke: #f0a830;  stroke-width: 1.5; cursor: pointer; }
  .n-empty  { fill: none;    stroke: #333;     stroke-width: 1;   }

  .n-demo:hover, .n-doc:hover, .n-sub:hover,
  .n-perfil:hover, .n-cred:hover { opacity: 0.8; }

  /* CONNECTOR LINES */
  .ln { stroke: #444; stroke-width: 1; fill: none; }

  .ln-doc    { stroke: #9d3d22; stroke-width: 0.75; fill: none; }
